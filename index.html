<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hassan Mobile">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B1220'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23F2A93B'/%3E%3C/svg%3E">
<title>Hassan Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --surface:#141B2D;
    --surface2:#1C2740;
    --border:#26314A;
    --accent:#F2A93B;
    --accent-dim:#8a6a2c;
    --accent-text:var(--accent-text);
    --green:#3DDC97;
    --red:#F2555A;
    --text:#EAF0FB;
    --muted:#8593AD;
  }
  [data-theme="light"]{
    --bg:#F3F5F9;
    --surface:#FFFFFF;
    --surface2:#F0F2F7;
    --border:#DDE2EC;
    --accent:#D98A2B;
    --accent-dim:#B97A28;
    --accent-text:#FFFFFF;
    --green:#1FA971;
    --red:#D93A46;
    --text:#1A2233;
    --muted:#6B7280;
  }
  [data-theme="slate"]{
    --bg:#1B212C;
    --surface:#232B38;
    --surface2:#2B3444;
    --border:#3A4456;
    --accent:#5B9BD5;
    --accent-dim:#3F6E96;
    --accent-text:#0D1B26;
    --green:#4CC08D;
    --red:#E0616B;
    --text:#E8ECF2;
    --muted:#8A93A3;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overscroll-behavior:none;
  }
  #app{display:flex; flex-direction:column; height:100vh; max-width:520px; margin:0 auto; position:relative;}

  header{
    padding:14px 18px 10px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  header .shopname{
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:19px; letter-spacing:0.3px;
    display:flex; align-items:center; gap:8px;
  }
  header .shopname .dot{width:8px;height:8px;border-radius:50%;background:var(--green); box-shadow:0 0 8px var(--green);}
  header button.icon-btn{
    background:none;border:none;color:var(--muted); padding:6px; cursor:pointer;
  }

  main{flex:1; overflow-y:auto; padding:16px 16px 90px;}

  .bottom-nav{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    padding:6px 6px;
    flex-shrink:0;
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--muted); font-family:'Inter'; font-size:11px;
    padding:8px 2px; cursor:pointer; border-radius:10px; transition:.15s;
  }
  .nav-btn svg{width:20px;height:20px;}
  .nav-btn.active{color:var(--accent);}
  .nav-btn.active svg{filter:drop-shadow(0 0 6px rgba(242,169,59,.5));}

  /* ---- Desktop / laptop layout (mobile stays exactly as-is below this width) ---- */
  @media (min-width:900px){
    body{ padding:24px; }
    #app{
      display:grid;
      grid-template-columns:230px 1fr;
      grid-template-rows:64px 1fr;
      grid-template-areas:
        "header header"
        "nav main";
      max-width:1200px;
      height:calc(100vh - 48px);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 25px 70px rgba(0,0,0,.55);
      border:1px solid var(--border);
    }
    header{ grid-area:header; }
    .bottom-nav{
      grid-area:nav;
      flex-direction:column;
      align-items:stretch;
      justify-content:flex-start;
      height:auto;
      border-bottom:none;
      border-right:1px solid var(--border);
      padding:18px 10px;
      gap:4px;
    }
    .nav-btn{
      flex-direction:row;
      justify-content:flex-start;
      gap:12px;
      padding:12px 14px;
      font-size:14px;
      border-radius:10px;
    }
    .nav-btn.active{ background:rgba(242,169,59,.1); }
    main{
      grid-area:main;
      max-width:760px;
      margin:0 auto;
      width:100%;
      padding:24px 32px 90px;
    }
    .fab{ display:none !important; }
  }

  /* Register display (signature element) */
  .register{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 20px;
    display:flex;
    gap:10px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .register::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity:.6;
  }
  .reg-cell{flex:1; text-align:center;}
  .reg-cell .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; font-family:'Inter';}
  .reg-cell .val{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:26px;
  }
  .reg-cell.sale .val{color:var(--accent); text-shadow:0 0 14px rgba(242,169,59,.35);}
  .reg-cell.profit .val{color:var(--green); text-shadow:0 0 14px rgba(61,220,151,.35);}
  .reg-divider{width:1px; background:var(--border);}

  .section-title{
    font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:14px;
    color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;
    margin:20px 0 10px;
  }
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
  }
  .item-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .search-wrap{position:relative;}
  .search-wrap input{padding-right:44px;}
  .mic-btn{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border-radius:50%; border:none; padding:0;
    background:var(--border); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--muted);
  }
  .mic-btn svg{width:16px; height:16px;}
  .mic-btn.listening{
    background:var(--red); color:#fff;
    animation: micPulse 1.2s ease-in-out infinite;
  }
  @keyframes micPulse{
    0%{box-shadow:0 0 0 0 rgba(255,70,70,.5);}
    70%{box-shadow:0 0 0 9px rgba(255,70,70,0);}
    100%{box-shadow:0 0 0 0 rgba(255,70,70,0);}
  }
  .item-info{flex:1; min-width:0;}
  .item-name{font-weight:600; font-size:15px; margin-bottom:3px;}
  .item-cat{font-size:11.5px; color:var(--muted);}
  .item-prices{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted); margin-top:4px;}
  .item-prices b{color:var(--text);}
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;
    padding:4px 9px; border-radius:20px; white-space:nowrap;
  }
  .badge.ok{background:rgba(61,220,151,.12); color:var(--green);}
  .badge.low{background:rgba(242,169,59,.12); color:var(--accent);}
  .badge.out{background:rgba(242,85,90,.12); color:var(--red);}

  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; cursor:grab; scrollbar-width:thin;}
  .chips.dragging{cursor:grabbing; user-select:none;}
  .chips::-webkit-scrollbar{height:5px;}
  .chips::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  .chips::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  .chip{
    flex-shrink:0; padding:8px 14px; border-radius:20px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); font-size:13px; font-weight:500; cursor:pointer;
  }
  .chip.active{background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600;}

  .empty{
    text-align:center; color:var(--muted); padding:40px 20px; font-size:14px; line-height:1.6;
  }

  button.primary{
    width:100%; padding:14px; border-radius:12px; border:none;
    background:var(--accent); color:var(--accent-text); font-weight:700; font-size:15px;
    font-family:'Chakra Petch',sans-serif; letter-spacing:.3px; cursor:pointer;
  }
  button.secondary{
    padding:10px 16px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text); font-size:13px; cursor:pointer;
  }
  button.danger-text{background:none;border:none;color:var(--red); font-size:13px; cursor:pointer; padding:6px;}

  .fab{
    position:absolute; right:18px; bottom:calc(70px + env(safe-area-inset-bottom));
    width:54px; height:54px; border-radius:50%;
    background:var(--accent); color:var(--accent-text); border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 18px rgba(242,169,59,.4); cursor:pointer; z-index:5;
  }
  .fab svg{width:24px;height:24px;}

  input, select{
    width:100%; padding:12px 13px; border-radius:10px;
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    font-family:'Inter'; font-size:14.5px; margin-bottom:12px;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px; font-weight:500;}

  .modal-overlay{
    position:absolute; inset:0; background:rgba(0,0,0,.6);
    display:flex; align-items:flex-end; z-index:20;
  }
  .modal{
    width:100%; background:var(--surface); border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto;
  }
  .modal h3{font-family:'Chakra Petch',sans-serif; font-size:17px; margin-bottom:16px;}
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}

  .qty-stepper{display:flex; align-items:center; gap:14px; justify-content:center; margin:16px 0;}
  .qty-stepper button{
    width:42px; height:42px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text); font-size:20px; cursor:pointer;
  }
  .qty-stepper .qty-val{font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; min-width:44px; text-align:center;}

  .sale-list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;
  }
  .sale-list-item:last-child{border-bottom:none;}
  .sale-list-item .t{color:var(--muted); font-size:11px; font-family:'JetBrains Mono',monospace;}

  .toast{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:var(--surface2); border:1px solid var(--accent); color:var(--text);
    padding:10px 18px; border-radius:10px; font-size:13.5px; z-index:50;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  ::-webkit-scrollbar{width:0;height:0;}
  /* visible drag-bar for the main content area (esp. desktop) so long lists like Inventory can be scrolled with a mouse */
  main{ scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  main::-webkit-scrollbar{ width:9px; height:9px; }
  main::-webkit-scrollbar-track{ background:transparent; }
  main::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
  main::-webkit-scrollbar-thumb:hover{ background:var(--muted); }
  .modal::-webkit-scrollbar{ width:9px; height:9px; }
  .modal::-webkit-scrollbar-track{ background:transparent; }
  .modal::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
  .modal{ scrollbar-width:thin; scrollbar-color:var(--border) transparent; }

  #printReceiptArea{display:none;}
  @media print{
    @page{ size:A4; margin:0; }
    body > *:not(#printReceiptArea){display:none !important;}
    #printReceiptArea{display:block !important; padding:0; margin:0; color:#000; background:#fff;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="shopname"><span class="dot"></span><span id="shopNameText">Hassan Mobile</span></div>
    <div style="display:flex; gap:4px;">
      <button class="icon-btn" id="lockBtn" style="display:none" onclick="lockApp()" title="Lock App">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" onclick="openSettingsModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008.4 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.09A1.65 1.65 0 003.6 8.4a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H8a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V8a1.65 1.65 0 001.51 1H22a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <nav class="bottom-nav">
    <button class="nav-btn" data-view="dashboard" onclick="switchView('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </button>
    <button class="nav-btn" data-view="inventory" onclick="switchView('inventory')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8L12 3 3 8m18 0l-9 5m9-5v10l-9 5M3 8l9 5m-9-5v10l9 5"/></svg>
      Inventory
    </button>
    <button class="nav-btn" data-view="sale" onclick="switchView('sale')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M1 1h4l2.6 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg>
      Sale
    </button>
    <button class="nav-btn" data-view="report" onclick="switchView('report')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Report
    </button>
    <button class="nav-btn" data-view="more" onclick="switchView('more')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      More
    </button>
  </nav>

  <main id="view"></main>

  <button class="fab" id="fabBtn" onclick="switchView('sale')" title="New Sale">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>
<div id="printReceiptArea"></div>
<datalist id="customerDatalist"></datalist>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script>
// OFFLINE PLACEHOLDER — Hassan Mobile ka apna Firebase project banne ke baad
// yahan uska config (apiKey, authDomain, projectId, storageBucket,
// messagingSenderId, appId) paste karein. Tab tak yeh app offline mode mein
// chalega — koi live database se link nahi hai, isliye Hassan Multimedia ka
// data safe hai.
const firebaseConfig = {
  apiKey: "AIzaSyC_VrCz1HmgLeFyc_TyTClsWW_AugDWpbs",
  authDomain: "hassan-mobile-f34bf.firebaseapp.com",
  projectId: "hassan-mobile-f34bf",
  storageBucket: "hassan-mobile-f34bf.firebasestorage.app",
  messagingSenderId: "922837045313",
  appId: "1:922837045313:web:288d96ab2cdedfe1f4b6c0"
};
let db = null;
let firebaseReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebaseReady = true;
  // Enable offline persistence so any edits made with a weak/dropped connection
  // (e.g. renaming a category) are queued in local storage and auto-synced once
  // back online, instead of being silently lost if the app is closed offline.

/* Fuzzy, word-order-independent search: "t90" matches "T-90", and "mouse t90 gaming"
   matches "Gaming Mouse T-90" regardless of word order, spacing, or hyphens. */
function fuzzyTextMatch(text, query){
  if(!query) return true;
  const norm = s => s.toLowerCase().replace(/[-_]/g,' ').replace(/\s+/g,' ').trim();
  const normText = norm(text);
  const normTextTight = normText.replace(/ /g,'');
  const normQuery = norm(query);
  const queryTight = normQuery.replace(/ /g,'');
  if(!queryTight) return true;
  if(normTextTight.includes(queryTight)) return true;
  const queryWords = normQuery.split(' ').filter(Boolean);
  if(queryWords.length>1){
    return queryWords.every(w => normTextTight.includes(w.replace(/ /g,'')));
  }
  return false;
}

async function loadItems(){
  try{
    const snapshot = await db.collection('items').get();
    if(snapshot.empty){
      const oldDoc = await db.collection('shop').doc('items').get();
      if(oldDoc.exists && oldDoc.data().list && oldDoc.data().list.length){
        items = oldDoc.data().list;
        await saveItems();
        return;
      }
      items = [];
    } else {
      items = snapshot.docs.map(doc => doc.data());
    }
  }catch(e){ items = []; console.error(e); }
}
async function saveItems(){
  // Full replace: only safe for one-time migration and explicit backup restore,
  // where overwriting the whole cloud collection with local memory is intentional.
  try{
    const snapshot = await db.collection('items').get();
    const existingIds = new Set(snapshot.docs.map(d=>d.id));
    const currentIds = new Set(items.map(i=>i.id));
    const batch = db.batch();
    existingIds.forEach(id=>{
      if(!currentIds.has(id)) batch.delete(db.collection('items').doc(id));
    });
    items.forEach(it=>{
      batch.set(db.collection('items').doc(it.id), it);
    });
    await batch.commit();
  }catch(e){ showToast('Cloud save failed — check internet connection'); console.error(e); }
}
async function saveItem(it){
  // Writes only this one item's document. Safe to use anytime — never touches
  // or deletes other items, so it can't wipe out changes made from another device.
  try{
    await db.collection('items').doc(it.id).set(it);
  }catch(e){ showToast('Cloud save failed — check internet connection'); console.error(e); }
}
async function deleteItemDoc(id){
  try{
    await db.collection('items').doc(id).delete();
  }catch(e){ showToast('Cloud save failed — check internet connection'); console.error(e); }
}
async function saveItemsBatch(itemsArr){
  // Upserts only the given items (e.g. after a category rename). Does NOT diff/delete
  // anything else in the collection, so it can't clobber items added on another device.
  if(!itemsArr || itemsArr.length===0) return;
  try{
    const batch = db.batch();
    itemsArr.forEach(it=> batch.set(db.collection('items').doc(it.id), it));
    await batch.commit();
  }catch(e){ showToast('Cloud save failed — check internet connection'); console.error(e); }
}

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function renameCategoryInSales(oldVal, newVal){
  // Sales store a snapshot of the item's category at sale time. When a category
  // is renamed, update that stored value on past sales too, so reports (which
  // group by category) keep showing them correctly instead of dumping them into "Other".
  try{
    const snapshot = await db.collection('sales').get();
    const batch = db.batch();
    let anyChange = false;
    snapshot.forEach(doc=>{
      const list = doc.data().list;
      if(!list || !list.length) return;
      let changed = false;
      const updated = list.map(s=>{
        if(s.category===oldVal){ changed = true; return {...s, category:newVal}; }
        return s;
      });
      if(changed){ batch.set(doc.ref, {list: updated}); anyChange = true; }
    });
    if(anyChange) await batch.commit();
  }catch(e){ console.error(e); }
}

async function findOrCreateCustomer(name, phone){
  const trimmed = (name||'').trim();
  if(!trimmed) return null;
  let existing = customers.find(c=>c.name.toLowerCase()===trimmed.toLowerCase());
  if(existing){
    if(phone && !existing.phone) existing.phone = phone;
    await saveCustomers();
    return existing.id;
  }
  const newCustomer = {id:uid(), name:trimmed, phone:phone||'', createdDate:todayStr()};
  customers.push(newCustomer);
  await saveCustomers();
  return newCustomer.id;
}
function refreshCustomerDatalist(){

/* ---------------- REAL-TIME SYNC ---------------- */
let unsubSalesListener = null;
function startRealtimeSync(){
  if(!firebaseReady) return;
  db.collection('items').onSnapshot(snapshot=>{
    items = snapshot.docs.map(doc => doc.data());
    if(['dashboard','inventory','sale','modelCompat'].includes(currentView)) refreshCurrentView();
  }, e=>console.error(e));

  db.collection('shop').doc('partTypes').onSnapshot(doc=>{
    if(doc.exists && doc.data().value){
      partTypes = doc.data().value;
      if(currentView==='inventory'||currentView==='sale'||currentView==='modelCompat') refreshCurrentView();
    }
  }, e=>console.error(e));

  db.collection('shop').doc('categories').onSnapshot(doc=>{
    if(doc.exists && doc.data().list && doc.data().list.length){
      categories = doc.data().list;
      if(currentView==='inventory'||currentView==='sale'||currentView==='modelCompat') refreshCurrentView();
    }
  }, e=>console.error(e));

  db.collection('shop').doc('subPartTypes').onSnapshot(doc=>{
    if(doc.exists && doc.data().value){
      subPartTypes = doc.data().value;
      if(currentView==='inventory'||currentView==='sale'||currentView==='modelCompat') refreshCurrentView();
    }
  }, e=>console.error(e));

  db.collection('shop').doc('creditEntries').onSnapshot(doc=>{
    if(doc.exists && doc.data().list){
      creditEntries = doc.data().list;
      if(currentView==='credit'||currentView==='more') refreshCurrentView();
    }
  }, e=>console.error(e));

  db.collection('shop').doc('shoppingList').onSnapshot(doc=>{
    if(doc.exists && doc.data().list){
      shoppingList = doc.data().list;
      if(currentView==='shopping'||currentView==='more') refreshCurrentView();
    }
  }, e=>console.error(e));

  db.collection('shop').doc('expenses').onSnapshot(doc=>{
    if(doc.exists && doc.data().list){
      expenseEntries = doc.data().list;
      if(currentView==='expense'||currentView==='more') refreshCurrentView();
    }
  }, e=>console.error(e));

  db.collection('shop').doc('customers').onSnapshot(doc=>{
    if(doc.exists && doc.data().list){
      customers = doc.data().list;
      if(currentView==='customers'||currentView==='customerDetail'||currentView==='more') refreshCurrentView();
    }
  }, e=>console.error(e));

  db.collection('shop').doc('repairJobs').onSnapshot(doc=>{
    if(doc.exists && doc.data().list){
      repairJobs = doc.data().list;
      if(currentView==='repairJobs'||currentView==='more') refreshCurrentView();
    }
  }, e=>console.error(e));

  db.collection('shop').doc('settings').onSnapshot(doc=>{
    if(doc.exists && doc.data().value){
      settings = doc.data().value;
      const nameEl = document.getElementById('shopNameText');
      if(nameEl) nameEl.textContent = settings.shopName;
    }
  }, e=>console.error(e));

  subscribeToSalesDate(todayStr());
}
function subscribeToSalesDate(date){
  if(unsubSalesListener) unsubSalesListener();
  unsubSalesListener = db.collection('sales').doc(date).onSnapshot(doc=>{
    if((currentView==='dashboard' && date===todayStr()) || (currentView==='report' && date===reportDate)){
      refreshCurrentView();
    }
  }, e=>console.error(e));
}
function refreshCurrentView(){
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='inventory') renderInventory();
  else if(currentView==='sale') renderSale();
  else if(currentView==='report') renderReportBody();
  else if(currentView==='credit') renderCredit();
  else if(currentView==='shopping') renderShopping();
  else if(currentView==='expense') renderExpense();
  else if(currentView==='customers') renderCustomers();
  else if(currentView==='customerDetail') renderCustomerDetail(currentCustomerId);
  else if(currentView==='repairJobs') renderRepairJobs();
  else if(currentView==='modelCompat') renderModelCompat();
  else if(currentView==='more') renderMore();
}

function confirmDeleteSale(date, saleId){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'deleteSaleOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Delete this Sale?</h3>
      <p style="color:var(--muted); font-size:13.5px; margin-bottom:18px; line-height:1.7;">
        This will remove the entry from today's sale and profit totals. This cannot be undone.
      </p>
      <button class="primary" style="background:var(--red)" onclick="deleteSaleEntry('${date}','${saleId}')">Yes, Delete It</button>
      <button class="secondary" style="width:100%; margin-top:10px" onclick="document.getElementById('deleteSaleOverlay').remove()">Cancel</button>
    </div>`;
  document.getElementById('app').appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}
async function deleteSaleEntry(date, saleId){
  const overlay = document.getElementById('deleteSaleOverlay');
  if(overlay) overlay.remove();
  showToast('Sale deleted');
  if(currentView==='dashboard') await renderDashboard();
  else if(currentView==='report') await renderReportBody();

  (async()=>{
    try{
      const sales = await loadSales(date);
      const saleToDelete = sales.find(s=>s.id===saleId);
      const updated = sales.filter(s=>s.id!==saleId);
      await saveSales(date, updated);
      if(saleToDelete && saleToDelete.itemId){
        const it = items.find(i=>i.id===saleToDelete.itemId);
        if(it){ it.qty += saleToDelete.qty; await saveItem(it); }
      }
    }catch(e){
      console.error(e);
      showToast('Delete could not be saved — check internet connection');
    }
  })();
}

async function saveSaleEdit(dateStr, saleId){
  const sales = await loadSales(dateStr);
  const s = sales.find(x=>x.id===saleId);
  if(!s){ showToast('Sale not found'); return; }
  const newName = document.getElementById('es_name').value.trim();
  const newQty = parseInt(document.getElementById('es_qty').value)||1;
  const newUnitSell = parseFloat(document.getElementById('es_unitsell').value)||0;
  const newUnitCost = parseFloat(document.getElementById('es_unitcost').value)||0;
  const newCustomerName = document.getElementById('es_customer').value.trim();
  const newPhone = document.getElementById('es_phone').value.trim();
  if(!newName){ showToast('Name is required'); return; }

  if(s.itemId){
    const it = items.find(i=>i.id===s.itemId);
    if(it){
      const diff = s.qty - newQty;
      it.qty = Math.max(0, it.qty + diff);
      await saveItem(it);
    }
  }

  let customerId = s.customerId || null;
  if(newCustomerName) customerId = await findOrCreateCustomer(newCustomerName, newPhone);

  s.name = newName;
  s.qty = newQty;
  s.unitSell = newUnitSell;
  s.unitCost = newUnitCost;
  s.totalSell = newUnitSell*newQty;
  s.totalProfit = (newUnitSell-newUnitCost)*newQty;
  s.customerName = newCustomerName || null;
  s.customerId = customerId;

  await saveSales(dateStr, sales);
  document.querySelector('.modal-overlay').remove();
  showToast('Sale updated ✓');
  if(currentView==='dashboard') await renderDashboard();
  else if(currentView==='report') await renderReportBody();
}

async function generateInvoice(dateStr, saleId){
  const sales = await loadSales(dateStr);
  const s = sales.find(x=>x.id===saleId);
  if(!s){ showToast('Sale not found'); return; }
  const customerName = document.getElementById('inv_customer_name').value.trim();
  const customerMobile = document.getElementById('inv_customer_mobile').value.trim();

  if(!s.invoiceNumber){
    if(!settings.nextInvoiceNumber) settings.nextInvoiceNumber = 1001;
    s.invoiceNumber = settings.nextInvoiceNumber;
    settings.nextInvoiceNumber += 1;
    await saveSettings();
  }
  if(customerName) s.customerName = customerName;
  if(customerMobile) s.customerMobile = customerMobile;
  await saveSales(dateStr, sales);

  const overlay = document.querySelector('.modal-overlay');
  if(overlay) overlay.remove();

  document.getElementById('printReceiptArea').innerHTML = buildInvoiceHTML(s.invoiceNumber, dateStr, s.customerName, s.customerMobile, [s]);
  setTimeout(()=>window.print(), 100);
}

async function generateMultiInvoice(){
  const dateStr = todayStr();
  const sales = await loadSales(dateStr);
  const selected = sales.filter(s=>selectedSaleIds.has(s.id));
  if(selected.length===0){ showToast('Selected items not found'); return; }
  const customerName = document.getElementById('inv_customer_name').value.trim();
  const customerMobile = document.getElementById('inv_customer_mobile').value.trim();

  if(!settings.nextInvoiceNumber) settings.nextInvoiceNumber = 1001;
  const invoiceNumber = settings.nextInvoiceNumber;
  settings.nextInvoiceNumber += 1;
  await saveSettings();

  selected.forEach(s=>{
    s.invoiceNumber = invoiceNumber;
    if(customerName) s.customerName = customerName;
    if(customerMobile) s.customerMobile = customerMobile;
  });
  await saveSales(dateStr, sales);

  const overlay = document.querySelector('.modal-overlay');
  if(overlay) overlay.remove();

  document.getElementById('printReceiptArea').innerHTML = buildInvoiceHTML(invoiceNumber, dateStr, customerName, customerMobile, selected);
  setTimeout(()=>window.print(), 100);
  selectedSaleIds.clear();
  renderDashboard();
}

function showLockScreen(){
  const overlay = document.createElement('div');
  overlay.id = 'lockOverlay';
  overlay.style.cssText = 'position:absolute; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;';
  overlay.innerHTML = `
    <div style="width:100%; max-width:300px; text-align:center;">
      <div style="font-size:36px; margin-bottom:10px;">🔒</div>
      <div style="font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:19px; margin-bottom:6px;">${settings.shopName}</div>
      <p style="color:var(--muted); font-size:13px; margin-bottom:20px;">Enter password to continue</p>
      <input id="lockPasswordInput" type="password" placeholder="Password" style="text-align:center; font-size:16px;">
      <button class="primary" onclick="attemptUnlock()">Unlock</button>
    </div>`;
  document.getElementById('app').appendChild(overlay);
  const inp = document.getElementById('lockPasswordInput');
  inp.focus();
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') attemptUnlock(); });
}
async function attemptUnlock(){
  const val = document.getElementById('lockPasswordInput').value;
  const hash = await sha256(val);
  if(hash === security.passwordHash){
    userRole = 'owner';
    try{ localStorage.setItem('shopManagerAuthRole', 'owner'); }catch(e){}
    document.getElementById('lockOverlay').remove();
    applyRoleRestrictions();
    await switchView('dashboard');
  } else if(security.staffPasswordHash && hash === security.staffPasswordHash){
    userRole = 'staff';
    try{ localStorage.setItem('shopManagerAuthRole', 'staff'); }catch(e){}
    document.getElementById('lockOverlay').remove();
    applyRoleRestrictions();
    await switchView('inventory');
  } else {
    showToast('Wrong password, try again');
    document.getElementById('lockPasswordInput').value='';
    document.getElementById('lockPasswordInput').focus();
  }
}
function lockApp(){
  document.getElementById('view').innerHTML = '';
  showLockScreen();
}
function forgetDevice(){
  try{ localStorage.removeItem('shopManagerAuthRole'); }catch(e){}
  document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
  showToast('Device logged out');
  lockApp();
}
function updateLockButtonVisibility(){
  document.getElementById('lockBtn').style.display = (security.passwordHash || security.staffPasswordHash) ? 'flex' : 'none';
}
const STAFF_ALLOWED_VIEWS = ['inventory','sale'];
function applyRoleRestrictions(){
  const isStaff = userRole==='staff';
  document.getElementById('settingsBtn').style.display = isStaff ? 'none' : 'flex';
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const v = b.dataset.view;
    b.style.display = (isStaff && !STAFF_ALLOWED_VIEWS.includes(v)) ? 'none' : 'flex';
  });
}

async function switchView(v){
  if(userRole==='staff' && !STAFF_ALLOWED_VIEWS.includes(v)){
    v = 'inventory';
  }
  currentView = v;
  const navKey = (v==='credit'||v==='shopping'||v==='expense'||v==='customers'||v==='customerDetail'||v==='repairJobs'||v==='modelCompat') ? 'more' : v;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===navKey));
  document.getElementById('fabBtn').style.display = (v==='dashboard' && userRole!=='staff') ? 'flex' : 'none';
  const el = document.getElementById('view');
  el.innerHTML = '<div class="empty">Loading...</div>';
  if(v==='dashboard'){ subscribeToSalesDate(todayStr()); await renderDashboard(); }
  else if(v==='inventory') await renderInventory();
  else if(v==='sale') await renderSale();
  else if(v==='report'){ subscribeToSalesDate(reportDate); await renderReport(); }
  else if(v==='more') await renderMore();
  else if(v==='credit') await renderCredit();
  else if(v==='shopping') await renderShopping();
  else if(v==='expense') await renderExpense();
  else if(v==='customers') await renderCustomers();
  else if(v==='customerDetail') await renderCustomerDetail(currentCustomerId);
  else if(v==='repairJobs') await renderRepairJobs();
  else if(v==='modelCompat') await renderModelCompat();
}

async function generateReportMultiInvoice(){
  const customerName = document.getElementById('inv_customer_name').value.trim();
  const customerMobile = document.getElementById('inv_customer_mobile').value.trim();

  if(!settings.nextInvoiceNumber) settings.nextInvoiceNumber = 1001;
  const invoiceNumber = settings.nextInvoiceNumber;
  settings.nextInvoiceNumber += 1;
  await saveSettings();

  // group selected entries by date so we only load/save each date's sales once
  const byDate = {};
  reportSelectedSales.forEach(({date, id})=>{
    if(!byDate[date]) byDate[date] = [];
    byDate[date].push(id);
  });

  const combinedLineItems = [];
  const dates = Object.keys(byDate).sort();
  for(const dateStr of dates){
    const sales = await loadSales(dateStr);
    const ids = byDate[dateStr];
    sales.forEach(s=>{
      if(ids.includes(s.id)){
        s.invoiceNumber = invoiceNumber;
        if(customerName) s.customerName = customerName;
        if(customerMobile) s.customerMobile = customerMobile;
        combinedLineItems.push(s);
      }
    });
    await saveSales(dateStr, sales);
  }

  const overlay = document.querySelector('.modal-overlay');
  if(overlay) overlay.remove();

  const displayDate = dates.length===1 ? dates[0] : `${dates[0]} to ${dates[dates.length-1]}`;
  document.getElementById('printReceiptArea').innerHTML = buildInvoiceHTML(invoiceNumber, displayDate, customerName, customerMobile, combinedLineItems);
  setTimeout(()=>window.print(), 100);
  reportSelectedSales.clear();
  await renderReportBody();
}

let activeRecognition = null;
function startVoiceSearch(target){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){ showToast('Voice search not supported on this browser'); return; }
  if(activeRecognition){ try{ activeRecognition.abort(); }catch(e){} activeRecognition = null; return; }
  const micBtn = document.getElementById(target+'MicBtn');
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  activeRecognition = recognition;
  if(micBtn) micBtn.classList.add('listening');
  recognition.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    const input = document.getElementById(target+'SearchInput');
    if(input){
      input.value = transcript;
      input.dispatchEvent(new Event('input'));
    }
  };
  recognition.onerror = (e)=>{
    if(e.error==='no-speech' || e.error==='aborted') return;
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){
      showToast('Mic blocked — allow microphone permission for this browser/page');
    } else if(e.error==='network'){
      showToast('Voice search needs internet — check your connection');
    } else {
      showToast('Voice search failed ('+e.error+') — try again');
    }
  };
  recognition.onend = ()=>{
    activeRecognition = null;
    const btn = document.getElementById(target+'MicBtn');
    if(btn) btn.classList.remove('listening');
  };
  try{ recognition.start(); }
  catch(e){ if(micBtn) micBtn.classList.remove('listening'); activeRecognition = null; }
}

function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Invalid image'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

async function saveCategoryRename(idx){
  const input = document.getElementById('cat_edit_'+idx);
  const newVal = input.value.trim();
  if(!newVal){ showToast('Name cannot be empty'); return; }
  const oldVal = categories[idx];
  if(newVal!==oldVal){
    categories[idx] = newVal;
    if(partTypes[oldVal]){ partTypes[newVal] = partTypes[oldVal]; delete partTypes[oldVal]; }
    Object.keys(subPartTypes).forEach(k=>{
      if(k.startsWith(oldVal+'::')){
        const newKey = newVal+'::'+k.split('::')[1];
        subPartTypes[newKey] = subPartTypes[k];
        delete subPartTypes[k];
      }
    });
    const changedItems = items.filter(it=>it.category===oldVal);
    changedItems.forEach(it=>{ it.category = newVal; });
    const ok1 = await saveCategories();
    const ok2 = await savePartTypes();
    const ok3 = await saveSubPartTypes();
    await saveItemsBatch(changedItems);
    await renameCategoryInSales(oldVal, newVal);
    if(ok1 && ok2 && ok3){
      showToast('Category updated ✓');
    } else {
      showCategorySyncWarning(idx, newVal);
      renderManageCategoriesModal();
      return;
    }
  }
  if(document.getElementById('f_cat')) populateCategorySelect(newVal);
  renderManageCategoriesModal();
}

  overlay.id = 'catSyncWarnOverlay';

async function saveItemForm(id){
  const name = document.getElementById('f_name').value.trim();
  let cat = document.getElementById('f_cat').value;
  const parttypeSel = document.getElementById('f_parttype');
  let partType = parttypeSel ? parttypeSel.value : null;
  if(partType==='__add_new__' || partType==='') partType = null;
  const subtypeSel = document.getElementById('f_subtype');
  let subPartType = (subtypeSel && document.getElementById('subTypeWrap').style.display!=='none') ? subtypeSel.value : null;
  if(subPartType==='__add_new__' || subPartType==='') subPartType = null;
  const cost = parseFloat(document.getElementById('f_cost').value)||0;
  const sell = parseFloat(document.getElementById('f_sell').value)||0;
  const qty = parseInt(document.getElementById('f_qty').value)||0;
  const models = document.getElementById('f_models').value.split(/[,=]/).map(m=>m.trim()).filter(m=>m.length>0);
  if(!name){ showToast('Item name is required'); return; }

  let movedToInventory = false;
  let savedItem;
  if(id){
    const it = items.find(i=>i.id===id);
    const wasModelCompat = it.category === 'Model Compatibility';
    if(wasModelCompat && cat==='Model Compatibility' && qty>0){
      cat = 'Mobile Accessories';
      movedToInventory = true;
    }
    Object.assign(it, {name, category:cat, partType, subPartType, cost, sell, qty, models, image: pendingItemImage});
    savedItem = it;
  } else {
    savedItem = {id:uid(), name, category:cat, partType, subPartType, cost, sell, qty, models, image: pendingItemImage};
    items.push(savedItem);
  }
  pendingItemImage = null;
  document.querySelector('.modal-overlay').remove();
  if(movedToInventory){
    showToast('Item moved to Inventory (Mobile Accessories) ✓');
    if(currentView==='modelCompat' || currentView==='dashboard') switchView('inventory');
    else refreshCurrentView();
  } else {
    showToast(id ? 'Item updated' : 'Item added');
    refreshCurrentView();
  }
  saveItem(savedItem); // saves in background; saveItem already shows its own error toast on failure
}

function getReportBuckets(){
  // Built live from the current categories + service types, so a renamed
  // category shows up correctly instead of falling into "Other".
  const catBuckets = categories.filter(c=>c!=='Model Compatibility');
  const serviceBuckets = SERVICE_TYPES.filter(t=>t!=='Other Service');
  return [...catBuckets, ...serviceBuckets];
}
function getSaleCategory(s){
  if(s.category) return s.category;
  if(s.itemId){
    const it = items.find(i=>i.id===s.itemId);
    if(it) return it.category;
  }
  if(s.isService){
    for(const t of SERVICE_TYPES){
      if(s.name===t || s.name.endsWith('('+t+')')) return t;
    }
  }
  return 'Other';
}
function getReportDateRange(){
  if(reportPeriod==='weekly'){
    const end = new Date(reportDate+'T00:00:00');
    const dates = [];
    for(let i=6;i>=0;i--){
      const d = new Date(end);
      d.setDate(d.getDate()-i);
      dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    }
    return dates;
  }
  if(reportPeriod==='monthly'){
    const [y,m] = reportMonth.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const dates = [];
    for(let d=1; d<=daysInMonth; d++){
      dates.push(y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
    }
    return dates;
  }
  return [reportDate];
}
async function fetchReportSales(){
  const dates = getReportDateRange();
  const arrays = await Promise.all(dates.map(async d=>{
    const arr = await loadSales(d);
    return arr.map(s=>({...s, _date: d}));
  }));
  const flat = arrays.flat();
  flat.sort((a,b)=> b._date.localeCompare(a._date));
  return flat;
}
/* ---------------- TREND GRAPH + PERIOD COMPARISON ---------------- */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getLast7Dates(endDate){
  const end = new Date(endDate+'T00:00:00');
  const dates = [];
  for(let i=6;i>=0;i--){ const d=new Date(end); d.setDate(d.getDate()-i); dates.push(ymd(d)); }
  return dates;
}
function getPrevPeriodDates(){
  if(reportPeriod==='daily'){
    const d = new Date(reportDate+'T00:00:00'); d.setDate(d.getDate()-1);
    return [ymd(d)];
  }
  if(reportPeriod==='weekly'){
    const end = new Date(reportDate+'T00:00:00'); end.setDate(end.getDate()-7);
    const dates = [];
    for(let i=6;i>=0;i--){ const d=new Date(end); d.setDate(d.getDate()-i); dates.push(ymd(d)); }
    return dates;
  }
  let [y,m] = reportMonth.split('-').map(Number);
  m -= 1; if(m===0){ m=12; y-=1; }
  const daysInMonth = new Date(y,m,0).getDate();
  const dates = [];
  for(let d=1; d<=daysInMonth; d++) dates.push(y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
  return dates;
}
async function fetchTotalsForDates(dates){
  const arrays = await Promise.all(dates.map(d=>loadSales(d)));
  let sale=0, profit=0;
  arrays.forEach(arr=>{ arr.forEach(s=>{ sale+=s.totalSell; profit+=s.totalProfit; }); });
  return {sale, profit};
}
function buildDateTotals(salesFlat, dates){
  const map = {};
  salesFlat.forEach(s=>{
    if(!map[s._date]) map[s._date] = {date:s._date, sale:0, profit:0};
    map[s._date].sale += s.totalSell;
    map[s._date].profit += s.totalProfit;
  });
  return dates.map(d=> map[d] || {date:d, sale:0, profit:0});
}
function daysElapsedInMonth(monthStr){
  // For averages: past months use their full day count, but the current
  // (in-progress) month should only be divided by days that have actually
  // occurred so far, not the whole month.
  const [y,m] = monthStr.split('-').map(Number);
  const daysInMonth = new Date(y,m,0).getDate();
  const curMonthStr = todayStr().slice(0,7);
  if(monthStr === curMonthStr) return Math.min(daysInMonth, parseInt(todayStr().slice(8,10),10));
  return daysInMonth;
}
function pctChangeText(cur, prev){
  if(prev===0){ return cur>0 ? {text:'▲ New', color:'var(--green)'} : {text:'—', color:'var(--muted)'}; }
  const pct = Math.round(((cur-prev)/prev)*100);
  if(pct>0) return {text:`▲ ${pct}%`, color:'var(--green)'};
  if(pct<0) return {text:`▼ ${Math.abs(pct)}%`, color:'var(--red)'};
  return {text:'– 0%', color:'var(--muted)'};
}
function renderTrendChartSVG(dateTotals){
  const n = dateTotals.length;
  if(n===0) return '<div class="empty" style="padding:20px;">No data</div>';
  const maxVal = Math.max(1, ...dateTotals.map(d=>Math.max(d.sale, d.profit)));
  const barW = n>15 ? 8 : (n>7 ? 16 : 28);
  const gap = n>15 ? 5 : (n>7 ? 10 : 16);
  const chartH = 110;
  const groupW = barW*2 + 3;
  const step = groupW + gap;
  const totalW = n*step + 10;
  const labelEvery = n>15 ? Math.ceil(n/8) : 1;
  let bars='', profitBars='', labels='';
  dateTotals.forEach((d,i)=>{
    const x = 6 + i*step;
    const saleH = Math.max(d.sale>0?2:0, Math.round((d.sale/maxVal)*chartH));
    const profitH = Math.max(d.profit>0?2:0, Math.round((d.profit/maxVal)*chartH));
    bars += `<rect x="${x}" y="${chartH-saleH}" width="${barW}" height="${saleH}" rx="2" style="fill:var(--accent)"></rect>`;
    profitBars += `<rect x="${x+barW+3}" y="${chartH-profitH}" width="${barW}" height="${profitH}" rx="2" style="fill:var(--green)"></rect>`;
    if(i%labelEvery===0 || i===n-1){
      const lbl = n>7 ? String(parseInt(d.date.slice(8,10),10)) : d.date.slice(5).replace('-','/');
      labels += `<text x="${x+groupW/2}" y="${chartH+15}" font-size="9" style="fill:var(--muted)" text-anchor="middle">${lbl}</text>`;
    }
  });
  return `<div style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
    <svg width="${totalW}" height="${chartH+28}" style="display:block; margin:0 auto; min-width:100%;">
      ${bars}
      <g id="trendProfitBars" style="filter:${profitVisible?'none':'blur(6px)'}; transition:filter .2s;">${profitBars}</g>
      ${labels}
    </svg>
  </div>
  <div style="display:flex; justify-content:center; gap:18px; margin-top:8px; font-size:11px; color:var(--muted);">
    <div style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:2px; background:var(--accent); display:inline-block;"></span>Sale</div>
    <div style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:2px; background:var(--green); display:inline-block;"></span>Profit</div>
  </div>`;
}
async function renderTrendSection(sales, totalSale, totalProfit){
  let dateTotals, prevTotals, periodWord;
  if(reportPeriod==='daily'){
    const last7 = getLast7Dates(reportDate);
    const arrays = await Promise.all(last7.map(async d=>{ const arr = await loadSales(d); return arr.map(s=>({...s,_date:d})); }));
    dateTotals = buildDateTotals(arrays.flat(), last7);
    periodWord = 'Day';
  } else {
    const dates = getReportDateRange();
    dateTotals = buildDateTotals(sales, dates);
    periodWord = reportPeriod==='weekly' ? 'Week' : 'Month';
  }
  prevTotals = await fetchTotalsForDates(getPrevPeriodDates());
  const daysWithRange = reportPeriod==='monthly' ? Math.max(1, daysElapsedInMonth(reportMonth)) : dateTotals.length;
  const avgBasisSale = reportPeriod==='daily' ? dateTotals.reduce((s,d)=>s+d.sale,0) : totalSale;
  const avgBasisProfit = reportPeriod==='daily' ? dateTotals.reduce((s,d)=>s+d.profit,0) : totalProfit;
  const avgSale = avgBasisSale / daysWithRange;
  const avgProfit = avgBasisProfit / daysWithRange;
  const bestDay = dateTotals.reduce((best,d)=> (!best || d.sale>best.sale) ? d : best, null);
  const saleChange = pctChangeText(totalSale, prevTotals.sale);
  const profitChange = pctChangeText(totalProfit, prevTotals.profit);
  const avgLabelSuffix = reportPeriod==='daily' ? ' (Last 7 Days)' : '';
  return `

function renderCategoryBreakdown(sales){

let advanceCategory = null;
let advancePartType = null;
let advanceSubPartType = null;
function setReportPeriod(p){ reportPeriod = p; renderReport(); }
function setReportSubTab(t){ reportSubTab = t; if(t==='advance'){ advanceCategory=null; advancePartType=null; advanceSubPartType=null; } renderReportBody(); }
function setAdvanceSort(s){ advanceSort = s; renderReportBody(); }
function drillAdvance(level, name){
  if(level==='category'){ advanceCategory = name; advancePartType = null; advanceSubPartType = null; }
  else if(level==='partType'){ advancePartType = name; advanceSubPartType = null; }
  else if(level==='subPartType'){ advanceSubPartType = name; }
  renderReportBody();
}
function breadcrumbAdvance(toLevel){
  if(toLevel==='root'){ advanceCategory=null; advancePartType=null; advanceSubPartType=null; }
  else if(toLevel==='category'){ advancePartType=null; advanceSubPartType=null; }
  else if(toLevel==='partType'){ advanceSubPartType=null; }
  renderReportBody();
}
/* ---- Advance tab: drill-down ranking (Category -> Sub-Category -> Sub-Sub-Category -> Hero Product/Service) ---- */
function getSalePartType(s){
  if(s.isService) return s.serviceSubType || null;
  if(s.itemId){ const it = items.find(i=>i.id===s.itemId); if(it) return it.partType || null; }
  return null;
}
function getSaleSubPartType(s){
  if(s.itemId){ const it = items.find(i=>i.id===s.itemId); if(it) return it.subPartType || null; }
  return null;
}
function getAdvanceFilteredSales(sales){
  let filtered = sales;
  if(advanceCategory) filtered = filtered.filter(s=>getSaleCategory(s)===advanceCategory);
  if(advancePartType) filtered = filtered.filter(s=>getSalePartType(s)===advancePartType);
  if(advanceSubPartType) filtered = filtered.filter(s=>getSaleSubPartType(s)===advanceSubPartType);
  return filtered;
}
function getAdvanceLevel(filtered){
  if(!advanceCategory) return 'category';
  if(!advancePartType) return filtered.some(s=>getSalePartType(s)) ? 'partType' : 'product';
  if(!advanceSubPartType) return filtered.some(s=>getSaleSubPartType(s)) ? 'subPartType' : 'product';
  return 'product';
}
function groupAdvanceSales(filtered, level){
  const map = {};
  filtered.forEach(s=>{
    let key, name;
    if(level==='category'){ key = getSaleCategory(s); name = key; }
    else if(level==='partType'){ key = getSalePartType(s) || 'Other'; name = key; }
    else if(level==='subPartType'){ key = getSaleSubPartType(s) || 'Other'; name = key; }
    else { key = s.itemId ? ('item::'+s.itemId) : ('name::'+s.name); name = s.name; }
    if(!map[key]) map[key] = { key, name, qty:0, sale:0, profit:0 };
    map[key].qty += (s.qty||0);
    map[key].sale += s.totalSell;
    map[key].profit += s.totalProfit;
  });
  return Object.values(map);
}
function renderAdvanceBody(sales){
  const filtered = getAdvanceFilteredSales(sales);
  const level = getAdvanceLevel(filtered);
  const groups = groupAdvanceSales(filtered, level);

  // Breadcrumb trail
  let crumbs = `<span onclick="breadcrumbAdvance('root')" style="cursor:pointer; ${!advanceCategory?'color:var(--text); font-weight:600;':'color:var(--accent);'}">All Categories</span>`;
  if(advanceCategory) crumbs += ` <span style="color:var(--muted)">›</span> <span onclick="breadcrumbAdvance('category')" style="cursor:pointer; ${!advancePartType?'color:var(--text); font-weight:600;':'color:var(--accent);'}">${advanceCategory}</span>`;
  if(advancePartType) crumbs += ` <span style="color:var(--muted)">›</span> <span onclick="breadcrumbAdvance('partType')" style="cursor:pointer; ${!advanceSubPartType?'color:var(--text); font-weight:600;':'color:var(--accent);'}">${advancePartType}</span>`;
  if(advanceSubPartType) crumbs += ` <span style="color:var(--muted)">›</span> <span style="color:var(--text); font-weight:600;">${advanceSubPartType}</span>`;

  const titleMap = { category:'Category Ranking', partType:'Sub-Category Ranking', subPartType:'Sub-Category Ranking', product:'Product / Service Ranking' };

  if(groups.length===0){
    return `<div style="font-size:12.5px; margin-bottom:10px;">${crumbs}</div><div class="section-title">${titleMap[level]}</div><div class="empty">No sales in this period.</div>`;
  }
  const sorted = [...groups].sort((a,b)=>{
    if(advanceSort==='profit') return b.profit-a.profit;
    if(advanceSort==='qty') return b.qty-a.qty;
    return b.sale-a.sale;
  });
  const medal = ['🥇','🥈','🥉'];
  let html = `
    <div style="font-size:12.5px; margin-bottom:10px; line-height:1.6;">${crumbs}</div>
    <div class="section-title" style="display:flex; align-items:center; justify-content:space-between;">
      <span>${titleMap[level]}</span>
    </div>
    <div class="chips" style="margin-bottom:10px;">
      <div class="chip ${advanceSort==='sale'?'active':''}" onclick="setAdvanceSort('sale')">By Sale</div>
      <div class="chip ${advanceSort==='profit'?'active':''}" onclick="setAdvanceSort('profit')">By Profit</div>
      <div class="chip ${advanceSort==='qty'?'active':''}" onclick="setAdvanceSort('qty')">By Qty</div>
    </div>
    <div class="card">`;
  sorted.forEach((c,i)=>{
    const rank = i<3 ? medal[i] : (i+1);
    const heroTag = (level==='product' && i===0) ? '<span class="badge ok" style="padding:2px 7px; font-size:10px; margin-left:6px;">🦸 Hero</span>' : '';
    const clickable = level!=='product';
    const rowAttrs = clickable ? `style="cursor:pointer;" onclick="drillAdvance('${level}','${c.name.replace(/'/g,"\\'")}')"` : '';
    const chevron = clickable ? '<span style="color:var(--muted); margin-left:6px;">›</span>' : '';
    html += `<div class="sale-list-item" ${rowAttrs}>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:26px; text-align:center; font-size:${i<3?'16px':'12px'}; color:var(--muted); font-weight:600;">${rank}</div>
        <div><div style="font-weight:600;">${c.name}${heroTag}</div><div class="t">Qty Sold: ${c.qty}</div></div>
      </div>
      <div style="text-align:right; display:flex; align-items:center; gap:2px;">
        <div>
          <div><b>${fmtMoney(c.sale)}</b></div>
          <div class="t profit-val" data-amt="${c.profit}" style="color:var(--green); cursor:pointer" onclick="event.stopPropagation(); toggleProfitValue()">${profitVisible ? '+'+fmtMoney(c.profit) : '••••'}</div>
        </div>
        ${chevron}
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

async function submitCreditPayment(id){

  if(!c) return;
  const amount = parseFloat(document.getElementById('cr_payment_amount').value)||0;
  if(amount<=0){ showToast('Enter a valid amount'); return; }
  if(!c.payments) c.payments = [];
  c.payments.push({amount, date: todayStr()});
  const paidAmt = getCreditPaidAmount(c);
  if(paidAmt >= c.amount){
    c.paid = true;
    c.paidDate = todayStr();
  }
  await saveCredit();
  document.querySelector('.modal-overlay').remove();
  showToast('Payment added ✓');
  renderCredit();
}
async function deleteCreditEntry(id){
  creditEntries = creditEntries.filter(x=>x.id!==id);
  await saveCredit();
  showToast('Entry deleted');
  renderCredit();
}

let expenseFilter = 'all';
let expensePeriod = 'all';
let expenseReportDate = todayStr();
let expenseReportMonth = todayStr().slice(0,7);
const EXPENSE_CATEGORIES = ['Daily Expense','Shop Expense'];
function getExpenseDateRange(){
  if(expensePeriod==='weekly'){
    const end = new Date(expenseReportDate+'T00:00:00');
    const dates = [];
    for(let i=6;i>=0;i--){
      const d = new Date(end);
      d.setDate(d.getDate()-i);
      dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    }
    return dates;
  }
  if(expensePeriod==='daily') return [expenseReportDate];
  return null;
}
async function renderExpense(){
  let list = expenseEntries;
  if(expenseFilter!=='all') list = list.filter(e=>e.category===expenseFilter);
  if(expensePeriod==='daily' || expensePeriod==='weekly'){
    const range = getExpenseDateRange();
    list = list.filter(e=>range.includes(e.date));
  } else if(expensePeriod==='monthly'){
    list = list.filter(e=>e.date && e.date.startsWith(expenseReportMonth));
  }
  list = list.slice().reverse();
  const totalFiltered = list.reduce((s,e)=>s+e.amount,0);

  const catLabel = expenseFilter!=='all' ? ` — ${expenseFilter}` : '';
  const periodLabel = expensePeriod==='daily' ? ` (${expenseReportDate})` : expensePeriod==='weekly' ? ` (week ending ${expenseReportDate})` : expensePeriod==='monthly' ? ` (${expenseReportMonth})` : '';

  let pickerHtml = '';
  if(expensePeriod==='daily' || expensePeriod==='weekly'){
    pickerHtml = `<input type="date" id="expenseDateInput" value="${expenseReportDate}" max="${todayStr()}">`;
  } else if(expensePeriod==='monthly'){
    pickerHtml = `<input type="month" id="expenseMonthInput" value="${expenseReportMonth}" max="${todayStr().slice(0,7)}">`;
  }

  let html = `
    <button class="secondary" style="margin-bottom:14px" onclick="switchView('more')">← Back</button>
    <div class="register">
      <div class="reg-cell sale" onclick="togglePrices()" style="cursor:pointer">
        <div class="lbl">Total Expenses${catLabel}${periodLabel}</div>
        <div class="val cost-val" data-amt="${totalFiltered}">${pricesVisible?fmtMoney(totalFiltered):'••••••'}</div>
        <div style="font-size:10px; color:var(--muted); margin-top:4px;">${pricesVisible?'':'Tap to reveal'}</div>
      </div>
    </div>
    <div class="section-title">Category</div>
    <div class="chips">
      <div class="chip ${expenseFilter==='all'?'active':''}" onclick="setExpenseFilter('all')">All</div>
      <div class="chip ${expenseFilter==='Daily Expense'?'active':''}" onclick="setExpenseFilter('Daily Expense')">Daily Expense</div>
      <div class="chip ${expenseFilter==='Shop Expense'?'active':''}" onclick="setExpenseFilter('Shop Expense')">Shop Expense</div>
    </div>
    <div class="section-title">Report Period</div>
    <div class="chips">
      <div class="chip ${expensePeriod==='all'?'active':''}" onclick="setExpensePeriod('all')">All Time</div>
      <div class="chip ${expensePeriod==='daily'?'active':''}" onclick="setExpensePeriod('daily')">Daily</div>
      <div class="chip ${expensePeriod==='weekly'?'active':''}" onclick="setExpensePeriod('weekly')">Weekly</div>
      <div class="chip ${expensePeriod==='monthly'?'active':''}" onclick="setExpensePeriod('monthly')">Monthly</div>
    </div>
    ${pickerHtml}
    <div id="expenseList" style="margin-top:14px"></div>
    <button class="primary" style="margin-top:6px" onclick="openExpenseModal()">+ Add Expense</button>
  `;
  document.getElementById('view').innerHTML = html;

  if(expensePeriod==='daily' || expensePeriod==='weekly'){
    document.getElementById('expenseDateInput').addEventListener('change', e=>{
      expenseReportDate = e.target.value; renderExpense();
    });
  } else if(expensePeriod==='monthly'){
    document.getElementById('expenseMonthInput').addEventListener('change', e=>{
      expenseReportMonth = e.target.value; renderExpense();
    });
  }

  const listEl = document.getElementById('expenseList');
  if(list.length===0){
    listEl.innerHTML = `<div class="empty">No expenses here.</div>`;
    return;
  }
  listEl.innerHTML = list.map(e=>`
    <div class="card">
      <div class="item-row">
        <div class="item-info">
          <div class="item-name">${e.description || e.category}</div>
          <div class="item-cat">${e.category}</div>
          <div class="item-prices">${e.date}</div>
        </div>
        <span class="badge low cost-val" data-amt="${e.amount}" style="cursor:pointer" onclick="togglePrices()">${pricesVisible?fmtMoney(e.amount):'••••'}</span>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="danger-text" onclick="deleteExpenseEntry('${e.id}')">Delete</button>
      </div>
    </div>
  `).join('');

  if(!name){ showToast('Customer name is required'); return; }

  } else {

    customers.push({id:uid(), name, phone, createdDate:todayStr()});

  document.getElementById('view').innerHTML = `

    <div id="custCreditList"></div>

    <div class="section-title">Sales History</div>
    <div id="custSalesList"><div class="empty">Loading...</div></div>
  `;

  const creditListEl = document.getElementById('custCreditList');
  creditListEl.innerHTML = custCredits.length===0 ? `<div class="empty">No credit entries.</div>` : custCredits.slice().reverse().map(e=>{
    const remaining = e.amount - getCreditPaidAmount(e);
    return `<div class="card">
      <div class="item-row">
        <div class="item-info">
          <div class="item-name">${e.description}</div>
          <div class="item-cat">${e.date}${e.paid?' · Fully paid on '+e.paidDate:''}</div>
        </div>
        <span class="badge ${e.paid?'ok':'low'}">${e.paid?'Paid':fmtMoney(remaining)}</span>
      </div>
    </div>`;
  }).join('');

  const salesListEl = document.getElementById('custSalesList');
  try{
    const snapshot = await db.collection('sales').get();
    let matches = [];
    snapshot.forEach(doc=>{
      const arr = doc.data().list || [];
      arr.forEach(s=>{
        if(s.customerId===c.id || (s.customerName && s.customerName.toLowerCase()===c.name.toLowerCase())){

        <div style="text-align:right"><b>${fmtMoney(s.totalSell)}</b></div>
      </div>
    `).join('');
  }catch(e){
    console.error(e);
    salesListEl.innerHTML = `<div class="empty">Could not load sales history.</div>`;
  }
}

    id: uid(), itemId: null, name: j.mobileModel + (j.note ? ' — '+j.note : ' — Repair'),
    qty: 1, unitCost: 0, unitSell: finalCharges,
    totalSell: finalCharges, totalProfit: finalCharges,
    time: String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
    isService: true, category: 'Mobile Repair', customerName: j.customerName, customerId
  });
  await saveSales(dateToUse, sales);
  const overlay = document.querySelector('.modal-overlay');
  if(overlay) overlay.remove();
  showToast('Marked as delivered — added to today\'s sale');
  renderRepairJobs();
}
async function deleteRepairJob(id){
  repairJobs = repairJobs.filter(x=>x.id!==id);
  await saveRepairJobs();
  showToast('Repair job deleted');
  renderRepairJobs();
}

function confirmMigrateModelCompat(){
  const candidates = items.filter(i=>i.category==='Mobile Accessories' && i.qty===0);
  if(candidates.length===0){
    showToast('No out-of-stock accessories to move');
    return;
  }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Move ${candidates.length} Item${candidates.length===1?'':'s'}?</h3>
      <p style="color:var(--muted); font-size:13px; margin-bottom:18px; line-height:1.7;">
        This will move all out-of-stock items currently under "Mobile Accessories" into a new "Model Compatibility" category. They'll stop showing in Inventory and Sale, but will still appear when you search a model on the Dashboard.
      </p>
      <button class="primary" onclick="runMigrateModelCompat()">Yes, Move Them</button>
      <button class="secondary" style="width:100%; margin-top:10px" onclick="document.querySelector('.modal-overlay').remove()">Cancel</button>
    </div>`;
  document.getElementById('app').appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}
async function runMigrateModelCompat(){
  const changedItems = items.filter(i=>i.category==='Mobile Accessories' && i.qty===0);
  changedItems.forEach(i=>{ i.category = 'Model Compatibility'; });
  const count = changedItems.length;
  await saveItemsBatch(changedItems);
  const overlay = document.querySelector('.modal-overlay');
  if(overlay) overlay.remove();
  showToast(`${count} item${count===1?'':'s'} moved to Model Compatibility ✓`);
  if(currentView==='inventory') renderInventory();
  else if(currentView==='sale') renderSale();
}

async function exportBackup(){
  showToast('Preparing backup...');
  let salesData = {};
  try{
    const snapshot = await db.collection('sales').get();
    snapshot.forEach(doc=>{
      if(doc.data().list) salesData['sales:'+doc.id] = doc.data().list;
    });
  }catch(e){ console.error(e); showToast('Could not fetch sales for backup'); }

  const backup = {
    exportedAt: new Date().toISOString(),
    items, settings, partTypes, categories, subPartTypes, serviceSubTypes, creditEntries, shoppingList, expenseEntries, customers, repairJobs,
    sales: salesData
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'shop-manager-backup-'+todayStr()+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded ✓');
}

async function handleRestoreFile(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(e){
    showToast('Invalid backup file');
    return;
  }
  openRestoreConfirmModal(data);
}
let pendingRestoreData = null;
function openRestoreConfirmModal(data){
  pendingRestoreData = data;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'restoreConfirmOverlay';
  const dateStr = data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'unknown date';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Restore Backup?</h3>
      <p style="color:var(--muted); font-size:13.5px; margin-bottom:18px; line-height:1.7;">
        This backup was exported on <b style="color:var(--text)">${dateStr}</b>. Restoring will replace all current inventory, sales history, categories and settings with the data in this file. This cannot be undone.
      </p>
      <button class="primary" onclick="confirmRestore()">Yes, Restore Now</button>
      <button class="secondary" style="width:100%; margin-top:10px" onclick="document.getElementById('restoreConfirmOverlay').remove()">Cancel</button>
    </div>`;
  document.getElementById('app').appendChild(overlay);
}
async function confirmRestore(){
  const data = pendingRestoreData;
  if(!data) return;
  try{
    if(data.items) { items = data.items; await saveItems(); }
    if(data.settings) { settings = data.settings; await saveSettings(); }
    if(data.partTypes) { partTypes = data.partTypes; await savePartTypes(); }
    if(data.categories) { categories = data.categories; await saveCategories(); }
    if(data.subPartTypes) { subPartTypes = data.subPartTypes; await saveSubPartTypes(); }
    if(data.serviceSubTypes) { serviceSubTypes = data.serviceSubTypes; await saveServiceSubTypes(); }
    if(data.customers) { customers = data.customers; await saveCustomers(); }
    if(data.repairJobs) { repairJobs = data.repairJobs; await saveRepairJobs(); }
    if(data.creditEntries) { creditEntries = data.creditEntries; await saveCredit(); }
    if(data.expenseEntries) { expenseEntries = data.expenseEntries; await saveExpenses(); }
    if(data.shoppingList) { shoppingList = data.shoppingList; await saveShopping(); }
    if(data.sales){
      for(const key in data.sales){
        const date = key.replace('sales:','');
        await saveSales(date, data.sales[key]);
      }
    }
    document.getElementById('shopNameText').textContent = settings.shopName;
    document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
    showToast('Backup restored ✓');
    await switchView('dashboard');
  }catch(e){
    showToast('Restore failed, please try again');
  }
}

/* ---------------- CHIP DRAG-SCROLL (for mouse users on desktop) ---------------- */
let chipDrag = { active:false, el:null, startX:0, scrollLeft:0, moved:false };
document.addEventListener('mousedown', e=>{
  const chip = e.target.closest('.chips');
  if(!chip) return;
  chipDrag.active = true;
  chipDrag.el = chip;
  chipDrag.startX = e.pageX;
  chipDrag.scrollLeft = chip.scrollLeft;
  chipDrag.moved = false;
  chip.classList.add('dragging');
});
document.addEventListener('mousemove', e=>{
  if(!chipDrag.active) return;
  const dx = e.pageX - chipDrag.startX;
  if(Math.abs(dx) > 3) chipDrag.moved = true;
  chipDrag.el.scrollLeft = chipDrag.scrollLeft - dx;
});
function endChipDrag(){
  if(chipDrag.el) chipDrag.el.classList.remove('dragging');
  chipDrag.active = false;
  chipDrag.el = null;
}
document.addEventListener('mouseup', endChipDrag);
document.addEventListener('mouseleave', endChipDrag);
document.addEventListener('click', e=>{
  if(chipDrag.moved && e.target.closest('.chip')){
    e.stopPropagation();
    e.preventDefault();
  }
  chipDrag.moved = false;
}, true);
document.addEventListener('wheel', e=>{
  const chip = e.target.closest('.chips');
  if(!chip) return;
  if(chip.scrollWidth > chip.clientWidth){
    chip.scrollLeft += e.deltaY;
    e.preventDefault();
  }
}, {passive:false});

/* ---------------- INIT ---------------- */
(async function init(){
  loadSavedTheme();
  if(!firebaseReady || !db){
    document.getElementById('view').innerHTML = `<div class="empty" style="padding:40px 20px; line-height:1.7;">Could not connect to the cloud database.<br>Please check your internet connection and reopen the app.</div>`;
    return;
  }
  await Promise.all([loadItems(), loadSettings(), loadPartTypes(), loadSecurity(), loadCredit(), loadShopping(), loadExpenses(), loadCategories(), loadSubPartTypes(), loadServiceSubTypes(), loadCustomers(), loadRepairJobs()]);
  // One-time default seeding, guarded by a flag so renamed categories/sub-categories
  // are never re-injected on later app loads (previously this ran every launch by
  // checking hardcoded default names, which kept resurrecting renamed categories).
  let partTypesChanged = false;
  let categoriesChanged = false;
  if(!settings.defaultsSeeded){
    if(!partTypes['Model Compatibility'] || partTypes['Model Compatibility'].length===0){
      partTypes['Model Compatibility'] = ['Display Screen','Batteries','Charging Jack','Ringer','Speaker','Mic','On/Off Switch'];
      partTypesChanged = true;
    }
    settings.defaultsSeeded = true;
    await saveSettings();
  }
  if(!categories.includes('Model Compatibility')){
    categories.push('Model Compatibility');
    categoriesChanged = true;
  }
  if(partTypesChanged) await savePartTypes();
  if(categoriesChanged) await saveCategories();
  document.getElementById('shopNameText').textContent = settings.shopName;
  updateLockButtonVisibility();
  startRealtimeSync();
  let savedRole = null;
  try{ savedRole = localStorage.getItem('shopManagerAuthRole'); }catch(e){}
  if(savedRole==='owner' || savedRole==='staff'){
    userRole = savedRole;
    applyRoleRestrictions();
    await switchView(userRole==='staff' ? 'inventory' : 'dashboard');
  } else if(security.passwordHash || security.staffPasswordHash){
    showLockScreen();
  } else {
    await switchView('dashboard');
  }
})();
</script>
